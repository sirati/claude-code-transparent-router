[package]
name = "claude-code-transparent-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sirati/claude-code-transparent-router"
description = "Loopback HTTP router for Claude Code: byte-verbatim passthrough to api.anthropic.com, Anthropic-Messages translation for a second provider"

[[bin]]
name = "claude-router"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream", "blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
listenfd = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
ratatui = "0.29"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
