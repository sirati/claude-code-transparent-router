listen = "127.0.0.1:9999"

[providers.alpha]
base_url = "http://alpha.example/v1"
models = [
  { id = "alpha-model", context_window = 400000 },
  { id = "alpha-model-mini", context_window = 128000 },
]

[providers.beta]
base_url = "http://beta.example/v1/"
api = "anthropic"
models = [
  { id = "beta-model", name = "Beta Model Pro", aliases = ["beta-pro"], context_window = 1000000 },
  { id = "beta-egress", upstream_id = "beta-model", name = "Beta Model via Egress" },
]

[providers.beta.ssh_proxy]
destination = "relay.example"
extra_flags = "-J bastion.example -p 2222"
agent_socket = "/run/user/1000/ssh-agent"

[providers.beta.effort]
field = "reasoning.effort"
default = "high"
remove = ["output_config"]
map = { low = "low", medium = "high", high = "high", xhigh = "high", max = "max" }
