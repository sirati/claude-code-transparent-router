# OpenAI Codex: the ChatGPT-subscription backend, reached with the OAuth
# login flow published in openai/codex (Apache-2.0). Sign in with
# `claude-router login codex`; no API key is involved.
#
# Consumes the signed-in account's Codex allowance. Check your plan's terms
# before pointing another client at it.
base_url = "https://chatgpt.com/backend-api/codex"
api = "responses"
# This backend rejects max_output_tokens outright ("Unsupported parameter"),
# and codex itself never sends one, so Anthropic's max_tokens is dropped
# rather than translated.
request_remove = ["max_output_tokens"]
# Shorthands select the newest model of that line, so `/model sol` keeps
# working across a version bump while `sol-5.6` stays exact.
# 1,050,000 context and 128,000 output are what OpenAI documents for Sol, and
# Terra and Luna share the family's limits. The numbers openai/codex ships
# (272000, max 872000) are that client's own budgets — the first is the
# threshold where long-context pricing starts — not the model's ceiling.
#
# At 1M or more these are named with Claude Code's [1m] marker, which assumes
# exactly 1,000,000 and so stays inside the real window.
models = [
  { id = "gpt-5.6-sol", name = "GPT-5.6 Sol", aliases = ["sol", "sol-5.6"], context_window = 1050000, max_output_tokens = 128000 },
  { id = "gpt-5.6-terra", name = "GPT-5.6 Terra", aliases = ["terra", "terra-5.6"], context_window = 1050000, max_output_tokens = 128000 },
  { id = "gpt-5.6-luna", name = "GPT-5.6 Luna", aliases = ["luna", "luna-5.6"], context_window = 1050000, max_output_tokens = 128000 },
]

[oauth]
issuer = "https://auth.openai.com"
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
scope = "openid profile email offline_access api.connectors.read api.connectors.invoke"
callback_port = 1455
callback_path = "/auth/callback"
refresh_format = "json"
account_id_claim = "https://api.openai.com/auth.chatgpt_account_id"
account_header = "ChatGPT-Account-ID"

[oauth.authorize_extra]
id_token_add_organizations = "true"
codex_cli_simplified_flow = "true"
originator = "codex_cli_rs"

[headers]
originator = "codex_cli_rs"

# This backend only answers streamed requests ("Stream must be set to true"),
# so it always streams upstream; a non-streaming caller gets the finished
# message assembled from that stream.
[request_extra]
store = false
stream = true
include = ["reasoning.encrypted_content"]
tool_choice = "auto"
parallel_tool_calls = true

# The Responses API reads reasoning.effort, not Anthropic's
# output_config.effort, so the field has to move -- but it accepts the same
# level names, so no mapping is needed. No default either: each model then
# applies its own canonical default (sol low, terra and luna medium).
[effort]
field = "reasoning.effort"
remove = ["output_config"]

# Codex compacts server-side: either POST responses/compact, or an ordinary
# turn whose last input item is {"type": "compaction_trigger"}. Both hold the
# summarisation prompt on the server and answer with a compaction item whose
# `encrypted_content` only Codex can read back -- Claude Code needs the summary
# as text, so neither is enabled here. A compaction reaches this provider as an
# ordinary turn carrying Claude Code's own summarisation instruction, which the
# model answers in text. To send it Codex's way regardless:
#
# [compaction]
# path = "responses/compact"
# trigger_item = "compaction_trigger"
# request_extra = { parallel_tool_calls = true }
# request_remove = ["tool_choice", "store", "stream", "include"]
