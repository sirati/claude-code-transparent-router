# OpenAI Codex: the ChatGPT-subscription backend, reached with the OAuth
# login flow published in openai/codex (Apache-2.0). Sign in with
# `claude-router login codex`; no API key is involved.
#
# Consumes the signed-in account's Codex allowance. Check your plan's terms
# before pointing another client at it.
base_url = "https://chatgpt.com/backend-api/codex"
api = "responses"
# Shorthands select the newest model of that line, so `/model sol` keeps
# working across a version bump while `sol-5.6` stays exact.
# context_window is the ceiling openai/codex uses for this backend
# (models.json `max_context_window`); its `context_window` of 272000 is the
# threshold above which long-context pricing applies, not a limit. The
# metered API advertises more for the same models — 1,050,000 total and
# 922,000 input for Sol — but the subscription backend is what these reach.
models = [
  { id = "gpt-5.6-sol", name = "GPT-5.6 Sol", aliases = ["sol", "sol-5.6"], context_window = 872000, max_output_tokens = 128000 },
  { id = "gpt-5.6-terra", name = "GPT-5.6 Terra", aliases = ["terra", "terra-5.6"], context_window = 872000, max_output_tokens = 128000 },
  { id = "gpt-5.6-luna", name = "GPT-5.6 Luna", aliases = ["luna", "luna-5.6"], context_window = 872000, max_output_tokens = 128000 },
]

[oauth]
issuer = "https://auth.openai.com"
client_id = "app_EMoamEEZ73f0CkXaXp7hrann"
scope = "openid profile email offline_access api.connectors.read api.connectors.invoke"
callback_port = 1455
callback_path = "/auth/callback"
refresh_format = "json"
account_id_claim = "https://api.openai.com/auth.chatgpt_account_id"
account_header = "ChatGPT-Account-ID"

[oauth.authorize_extra]
id_token_add_organizations = "true"
codex_cli_simplified_flow = "true"
originator = "codex_cli_rs"

[headers]
originator = "codex_cli_rs"

[request_extra]
store = false
stream = true
include = ["reasoning.encrypted_content"]
tool_choice = "auto"
parallel_tool_calls = true

# The Responses API reads reasoning.effort, not Anthropic's
# output_config.effort, so the field has to move -- but it accepts the same
# level names, so no mapping is needed. No default either: each model then
# applies its own canonical default (sol low, terra and luna medium).
[effort]
field = "reasoning.effort"
remove = ["output_config"]
