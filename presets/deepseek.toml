# DeepSeek via its Anthropic-compatible endpoint.
# Verified: this endpoint validates Anthropic's own output_config.effort
# (low|medium|high|xhigh|ultra|max) and ignores the reasoning.effort /
# reasoning_effort spellings; DeepSeek collapses medium and xhigh to high.
# Credential: set it in the router TUI, or DEEPSEEK_API_KEY.
base_url = "https://api.deepseek.com/anthropic"
api = "anthropic"
# Shorthands select the newest model of that line, so `/model pro` keeps
# working across a version bump while `pro-v4` stays exact.
models = [
  { id = "deepseek-v4-pro", name = "DeepSeek 4 Pro", aliases = ["pro", "pro-v4"], context_window = 1000000, max_output_tokens = 384000 },
  { id = "deepseek-v4-flash", name = "DeepSeek 4 Flash", aliases = ["flash", "flash-v4"], context_window = 1000000, max_output_tokens = 384000 },
]

[effort]
field = "output_config.effort"
map = { low = "low", medium = "high", high = "high", xhigh = "high", max = "max" }
